<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류</title>
</head>
<body>
<main>
    <h1>오류가 발생했습니다.</h1>
    <p th:text="${error}">오류 메시지</p>
    <p th:if="${detail != null}" th:text="${detail}">상세 메시지</p>
    <p th:if="${path != null}" th:text="${path}">요청 경로</p>
    <a href="/stocks">목록으로 이동</a>
</main>
</body>
</html>
