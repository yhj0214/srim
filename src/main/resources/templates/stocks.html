<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: layout(~{::section})}">

<body>
<section class="page" data-page="stocks">
    <h1 class="page__title">종목 목록</h1>

    <!-- 검색 -->
    <form class="searchInline" th:action="@{/stocks}" method="get">
        <input
            class="searchInline__input"
            type="text"
            name="q"
            th:value="${keyword}"
            placeholder="회사명 또는 종목코드 검색"
            autocomplete="off"
        />

        <button class="searchInline__btn" type="submit">검색</button>
    </form>

    <!-- 결과 요약 -->
    <p class="muted" th:if="${stocks != null}">
        총 <span class="badge" th:text="${stocks.totalElements}">0</span>개 (현재 <span th:text="${stocks.number + 1}">1</span> / <span th:text="${stocks.totalPages}">1</span> 페이지)
    </p>

    <!-- 테이블 -->
    <div class="tableWrap" th:if="${stocks != null && stocks.content != null && !stocks.content.isEmpty()}">
        <table class="table">
            <thead>
            <tr>
                <th>회사명</th>
                <th>종목코드</th>
                <th>시장</th>
                <th class="hideSm">업종</th>
                <th class="hideSm">상장일</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s : ${stocks.content}">
                <td>
                    <a class="link"
                       th:href="@{/stocks/{key}(key=${s.market + '-' + s.tickerKrx})}"
                       th:text="${s.companyName}">
                        회사명
                    </a>
                </td>
                <td th:text="${s.tickerKrx}">000000</td>
                <td th:text="${s.market}">KOSPI</td>
                <td class="hideSm" th:text="${s.industry}">업종</td>
                <td class="hideSm" th:text="${s.listingDate}">2024-01-01</td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="empty" th:if="${stocks == null || stocks.content == null || stocks.content.isEmpty()}">
        조회된 종목이 없습니다.
    </p>

    <!-- 페이징 -->
    <div class="pager" th:if="${stocks != null && stocks.totalPages > 1}"
         th:with="
          current=${stocks.number},
          total=${stocks.totalPages},
          size=${stocks.size},
          blockSize=${T(java.lang.Integer).valueOf(5)},
          start=${T(java.lang.Math).floorDiv(current, blockSize) * blockSize},
          tmpEnd=${start + blockSize - 1},
          end=${tmpEnd < total - 1 ? tmpEnd : total - 1}
        ">

        <!-- 이전 페이지 -->
        <a class="pager__btn"
           th:if="${stocks.hasPrevious()}"
           th:href="@{/stocks(page=${current - 1}, size=${size}, q=${keyword})}">
            이전
        </a>
        <span class="pager__btn pager__btn--disabled" th:if="${!stocks.hasPrevious()}">이전</span>

        <!-- 페이지 번호(5개) -->
        <a class="pager__num"
           th:each="p : ${#numbers.sequence(start, end)}"
           th:classappend="${p == current} ? ' is-active' : ''"
           th:text="${p + 1}"
           th:href="@{/stocks(page=${p}, size=${size}, q=${keyword})}">
            1
        </a>

        <!-- 다음 페이지 -->
        <a class="pager__btn"
           th:if="${stocks.hasNext()}"
           th:href="@{/stocks(page=${current + 1}, size=${size}, q=${keyword})}">
            다음
        </a>
        <span class="pager__btn pager__btn--disabled" th:if="${!stocks.hasNext()}">다음</span>
    </div>

</section>
</body>
</html>
