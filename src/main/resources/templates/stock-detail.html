<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">

    <body>
        <section class="page" data-page="stock-detail"
                 th:attr="data-market=${stock.market},
                        data-ticker=${stock.tickerKrx},
                        data-stock-id=${stock.stockId},
                        data-company-id=${stock.companyId}">
            <div class="detailHead">
                <div>
                    <h1 class="page__title" th:text="${stock.companyName}">회사명</h1>
                    <div class="detailHead__meta">
                        <span class="code" th:text="${stock.tickerKrx}">000000</span>
                        <span class="badge" th:text="${stock.market}">KOSPI</span>
                        <span class="muted" th:text="${stock.industry}">업종</span>
                        <span class="muted" th:text="${stock.region}">지역</span>
                    </div>
                </div>
                <a class="btnOutline" th:href="@{/stocks(q=${param.q}, page=${param.page}, size=${param.size})}">← 목록으로</a>
            </div>


            <div class="tabs" role="tablist">
                <button class="tab is-active" data-tab="srim" type="button">S-RIM</button>
                <button class="tab" data-tab="financial" type="button">재무정보</button>
                <button class="tab" data-tab="chart" type="button">그래프</button>
            </div>

            <div class="tabPanels">
                <div class="tabPanel" data-panel="chart" hidden>
                    <p class="muted">차트는 다음 단계에서 연결합니다.</p>
                </div>

                <div class="tabPanel" data-panel="financial" hidden>
                    <p class="muted">재무정보는 다음 단계에서 연결합니다.</p>
                </div>

                <div class="tabPanel" data-panel="srim">
                    <div id="srimResultContainer">
                        <!-- JS가 여기다 렌더 -->
                    </div>
                </div>
            </div>

        </section>
    </body>
</html>
