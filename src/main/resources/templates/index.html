<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<!--
    ~{...} 은 어던 템플릿의 조각을 가져와서 이 자리와 치환하도록
    a :: b ( ... ) a는 템플릿 이름 a.html
    b는 a안에 정의돈 fragment 이름 th:fragment="b"
 -->
<body>
<section class="hero" data-page="home">

    <div class="hero__logo">
        <svg class="logoIcon" viewBox="0 0 64 64" aria-hidden="true">
            <!-- 축 -->
            <path d="M10 10v44h44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <!-- 상승 그래프 -->
            <path d="M18 44l12-16 10 10 16-22" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- 화살표 -->
            <path d="M56 16l-2 10-10-2" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <div class="logoText">SRIM</div>
    </div>

    <p class="hero__subtitle">주식 가격 조사를 위한 웹 서비스</p>

    <p class="hero__count">
        총 <span class="badge" id="totalStocksBadge" th:text="${totalStocks}">0</span>개 종목 등록
    </p>

    <form class="search" action="/stocks/search" method="get" id="homeSearchForm">
        <span class="search__icon" aria-hidden="true">⌕</span>
        <input
            class="search__input"
            type="text"
            id="homeSearchInput"
            name="q"
            placeholder="종목명 또는 종목코드를 입력하세요 (예: 삼성전자, 005930)"
            autocomplete="off"
        />
        <button class="search__btn" type="submit">검색</button>
    </form>

    <p id="homeSearchHint" class="hint" style="display:none;">
        검색어를 입력하세요.
    </p>

</section>
</body>
</html>
