spring:
  application:
    name: srim
  
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

app:
  crawl:
    userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    delay-ms: 1200
    max-retries: 3
    initial-backoff-ms: 800

  scheduler:
    zone: Asia/Seoul
    price:
      cron: "0 0 3 * * *"
      backfill-days: 3
    bond-yield:
      cron: "0 30 3 * * *"
    bond-yield-retry:
      fixed-delay-ms: 300000
      initial-delay-ms: 300000
    financial-statement:
      cron: "0 30 4 * * *"
