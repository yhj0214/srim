plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.yhj'
version = '0.0.1-SNAPSHOT'
description = 'srim'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'

    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Apache POI for Excel processing
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // HTML Parsing
    implementation 'org.jsoup:jsoup:1.17.2'

    // Selenium for dynamic content
    implementation 'org.seleniumhq.selenium:selenium-java:4.15.0'

    // Retry
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Jackson for Java Time
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // WebClient for API calls
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
}

def osName = System.getProperty("os.name").toLowerCase()
def isWindows = osName.contains("win")
def enableTls12 = System.getenv("ENABLE_TLS12") == "true"

def generated = 'build/generated/sources/annotationProcessor/java/main'

sourceSets {
    main.java.srcDirs += [ generated ]
}

tasks.withType(JavaCompile) {
    options.annotationProcessorGeneratedSourcesDirectory = file(generated)
}

test {
    // 다트 서버 연결 시 문제 발생하여 추가
    if (isWindows) {
        systemProperty "javax.net.ssl.trustStoreType", "Windows-ROOT"
    }

    if (enableTls12) {
        jvmArgs "-Djdk.tls.client.protocols=TLSv1.2"
        jvmArgs "-Dhttps.protocols=TLSv1.2"
    }

    useJUnitPlatform{
        excludeTags "manual"
    }
}

bootRun {
    if (isWindows) {
        systemProperty "javax.net.ssl.trustStoreType", "Windows-ROOT"
    }

    if (enableTls12) {
        jvmArgs "-Djdk.tls.client.protocols=TLSv1.2"
        jvmArgs "-Dhttps.protocols=TLSv1.2"
    }
}
